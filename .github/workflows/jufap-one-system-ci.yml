name: JUFAP One System CI

on:
  push:
    branches:
      - jufap-one-foundation
    paths:
      - "jufap-one-system/**"
      - ".github/workflows/jufap-one-system-ci.yml"
  pull_request:
    paths:
      - "jufap-one-system/**"
      - ".github/workflows/jufap-one-system-ci.yml"

permissions:
  contents: read

concurrency:
  group: jufap-one-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jufap-one-system
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jufap-one-system/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate TypeScript, tests and production builds
        run: npm run check

      - name: Validate Power BI audit tool
        run: python -m py_compile tools/pbi-audit/scan_pbip.py
