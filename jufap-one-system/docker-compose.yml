services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jufap_one
      POSTGRES_USER: jufap_one
      POSTGRES_PASSWORD: jufap_one
    ports:
      - "5432:5432"
    volumes:
      - jufap_one_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jufap_one -d jufap_one"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - jufap_one_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  jufap_one_postgres:
  jufap_one_redis:
